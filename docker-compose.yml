services:
  db:
    image: postgres:16
    container_name: mynewneighbor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_pw
      POSTGRES_DB: mynewneighbor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d mynewneighbor"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata: